<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HRMSC | Human Resource Management & Course Portal</title>
    
    <link rel="icon" type="image/png" href="PIN LOGO.png">
    
    <style>
        :root {
            --corporate-navy: #0f172a;
            --corporate-slate: #1e293b;
            --corporate-blue: #0284c7;
            --accent-gold: #d97706;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.95);
            --border-subtle: rgba(148, 163, 184, 0.2);
            --shadow-elevation: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--corporate-navy); 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-light);
        }

        /* CLEAN CORPORATE HEADER */
        #corporate-header {
            position: absolute; top: 0; left: 0; width: 100%; height: 70px;
            background: var(--corporate-slate);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; padding: 0 30px;
            z-index: 1100; box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-brand { display: flex; align-items: center; }
        #header-logo { height: 42px; margin-right: 15px; border-radius: 6px; }
        #header-title { font-weight: 700; letter-spacing: 1px; font-size: 16px; color: #fff; }
        #header-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 1.5px;}

        .header-badge {
            background: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        #folder-toggle-btn {
            position: fixed; right: 30px; top: 90px; z-index: 2000;
            background: var(--corporate-slate);
            border: 1px solid var(--border-subtle);
            color: var(--text-light);
            padding: 10px 16px; cursor: pointer;
            font-family: inherit; font-size: 11px; font-weight: 600;
            border-radius: 6px;
            box-shadow: var(--shadow-elevation);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        #folder-toggle-btn:hover { background: var(--corporate-blue); border-color: var(--corporate-blue); }

        #command-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1200; display: block; opacity: 1;
            background-color: var(--corporate-navy);
        }

        #logo-blend-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; opacity: 0.05;
            mix-blend-mode: luminosity; pointer-events: none;
        }

        .viewport-grid {
            position: absolute; top: 95px; left: 2%; width: 96%; height: 85%;
            display: grid; 
            grid-template-columns: 1fr 1fr;
            gap: 20px; z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .viewport-grid.hide-archive {
            grid-template-columns: 1fr 0fr;
            gap: 0;
        }

        .pane {
            display: flex; flex-direction: column;
            border: 1px solid var(--border-subtle);
            background: var(--glass-bg); 
            border-radius: 10px; overflow: hidden;
            box-shadow: var(--shadow-elevation);
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #folder-pane { transform-origin: right; }
        .hide-archive #folder-pane {
            opacity: 0; transform: scaleX(0); pointer-events: none;
        }

        .pane-header {
            background: rgba(30, 41, 59, 0.95); padding: 12px 20px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--text-light);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center;
        }

        .sync-indicator {
            font-size: 10px; color: #38bdf8; font-weight: 500;
            display: flex; align-items: center; gap: 6px;
        }

        .view-toggle-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8; padding: 4px 10px; font-size: 10px; font-weight: 600;
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
        }
        .view-toggle-btn:hover { background: #38bdf8; color: #0f172a; }

        iframe { width: 100%; height: 100%; border: none; background: transparent; }

        @media (max-width: 900px) {
            .viewport-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; top: 80px; height: 88%; }
            .viewport-grid.hide-archive { grid-template-rows: 1fr 0fr; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header id="corporate-header">
        <div class="header-brand">
            <img src="PIN LOGO.png" id="header-logo" alt="HRMSC">
            <div>
                <div id="header-title">HRMSC | EXECUTIVE LEARNING & RECORDS</div>
                <div id="header-subtitle">Human Resource Management & Professional Development Course Portal</div>
            </div>
        </div>
        <div class="header-badge">Enterprise Portal v4.2</div>
    </header>

    <button id="folder-toggle-btn" onclick="toggleFolder()">[ ARCHIVE: VISIBLE ]</button>

    <div id="command-interface">
        <img src="BLEND.png" id="logo-blend-bg" alt="Background">
        
        <div class="viewport-grid" id="main-grid">
            <div class="pane" id="input-pane">
                <div class="pane-header">
                    <span>PORTAL: COURSE REGISTRATION & ENROLLMENT</span>
                    <span style="color: #34d399; font-size: 10px;">● SECURE CONNECTION</span>
                </div>
                <iframe id="order-frame" src="about:blank"></iframe>
            </div>

            <div class="pane" id="folder-pane">
                <div class="pane-header">
                    <span>HRMSC RECORDS & MODULE ARCHIVE</span>
                    <span class="sync-indicator" id="sync-icon"><span>●</span> LIVE SYNC</span>
                    <button class="view-toggle-btn" onclick="toggleView()">TOGGLE VIEW</button>
                </div>
                <iframe id="folder-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_UPLINK = "https://script.google.com/macros/s/AKfycbyGKF5w3DeyNgy7VsQra02txkyci1I1EMekXqpVRXk6MaPAvOKlww1FblCIjDrYWILiQQ/exec";
        const DRIVE_FOLDER_ID = "1E5z6QNMmJFtM2xut38Ohul3PXZzCNFZy";
        const REFRESH_RATE = 30000;
        
        let currentView = "grid"; 
        const getEmbedURL = (mode) => `https://drive.google.com/embeddedfolderview?id=${DRIVE_FOLDER_ID}#${mode}`;

        function initializeCommandCenter() {
            const orderFrame = document.getElementById('order-frame');
            orderFrame.src = GOOGLE_UPLINK;
            refreshFolder();
            setInterval(refreshFolder, REFRESH_RATE);
        }

        function refreshFolder() {
            const folderFrame = document.getElementById('folder-frame');
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.innerHTML = "<span>↻</span> SYNCING...";
            folderFrame.src = getEmbedURL(currentView);
            setTimeout(() => {
                syncIcon.innerHTML = "<span>●</span> LIVE SYNC";
            }, 2000);
        }

        function toggleFolder() {
            const grid = document.getElementById('main-grid');
            const btn = document.getElementById('folder-toggle-btn');
            grid.classList.toggle('hide-archive');
            const isHidden = grid.classList.contains('hide-archive');
            btn.innerText = isHidden ? "[ ARCHIVE: HIDDEN ]" : "[ ARCHIVE: VISIBLE ]";
        }

        function toggleView() {
            currentView = (currentView === "grid") ? "list" : "grid";
            refreshFolder();
        }

        window.onload = initializeCommandCenter;
    </script>
</body>
</html>
