<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HRMSC | Official Shirt Order Form</title>
    
    <link rel="icon" type="image/png" href="PIN.png">
    
    <style>
        :root {
            --corporate-navy: #0f172a;
            --corporate-slate: #1e293b;
            --corporate-blue: #0284c7;
            --accent-gold: #d97706;
            --gcash-blue: #007DF4;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.95);
            --border-subtle: rgba(148, 163, 184, 0.2);
            --shadow-elevation: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--corporate-navy); 
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-light);
            user-select: none;
            -webkit-user-select: none;
        }

        /* CLEAN CORPORATE HEADER */
        #corporate-header {
            position: absolute; top: 0; left: 0; width: 100%; height: 65px;
            background: var(--corporate-slate);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
            z-index: 1100; box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-brand { display: flex; align-items: center; overflow: hidden; }
        #header-logo { height: 38px; margin-right: 12px; border-radius: 6px; flex-shrink: 0; }
        .header-text-container { display: flex; flex-direction: column; overflow: hidden; }
        #header-title { font-weight: 700; letter-spacing: 0.5px; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #header-subtitle { font-size: 10px; color: var(--text-muted); margin-top: 1px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        .header-badge {
            background: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            flex-shrink: 0;
            display: none;
        }

        @media (min-width: 600px) {
            .header-badge { display: block; }
            #corporate-header { padding: 0 30px; height: 70px; }
            #header-title { font-size: 15px; }
        }

        /* ASSISTED TOUCH / DRAGGABLE GCASH FLOATING WIDGET */
        #gcash-float-banner {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 4000;
            background: linear-gradient(135deg, #0056b3, var(--gcash-blue));
            color: #fff;
            padding: 12px 18px;
            border-radius: 35px;
            box-shadow: 0 10px 25px rgba(0, 125, 244, 0.5);
            display: flex; 
            align-items: center; 
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 12px; 
            font-weight: 600;
            cursor: grab;
            touch-action: none;
            transition: box-shadow 0.2s ease, transform 0.1s ease;
        }

        #gcash-float-banner:active {
            cursor: grabbing;
            transform: scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 125, 244, 0.7);
        }

        .gcash-icon {
            background: #fff; 
            color: var(--gcash-blue);
            width: 26px; height: 26px; 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 12px; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .drag-handle-dots {
            display: flex;
            flex-direction: column;
            gap: 2px;
            opacity: 0.6;
            margin-left: 2px;
        }

        .drag-handle-dots span {
            width: 3px; height: 3px;
            background: #fff;
            border-radius: 50%;
        }

        #folder-toggle-btn {
            position: fixed; right: 15px; top: 78px; z-index: 2000;
            background: var(--corporate-slate);
            border: 1px solid var(--border-subtle);
            color: var(--text-light);
            padding: 6px 12px; cursor: pointer;
            font-family: inherit; font-size: 10px; font-weight: 600;
            border-radius: 6px;
            box-shadow: var(--shadow-elevation);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        #folder-toggle-btn:hover { background: var(--corporate-blue); border-color: var(--corporate-blue); }

        #command-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1200; display: block; opacity: 1;
            background-color: var(--corporate-navy);
        }

        #logo-blend-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; opacity: 0.05;
            mix-blend-mode: luminosity; pointer-events: none;
        }

        /* Mobile First Layout */
        .viewport-grid {
            position: absolute; top: 78px; left: 2%; width: 96%; height: calc(100% - 95px);
            display: grid; 
            grid-template-columns: 1fr 0fr;
            gap: 0; z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .viewport-grid.show-archive {
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .pane {
            display: flex; flex-direction: column;
            border: 1px solid var(--border-subtle);
            background: var(--glass-bg); 
            border-radius: 10px; overflow: hidden;
            box-shadow: var(--shadow-elevation);
            backdrop-filter: blur(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #folder-pane { transform-origin: right; opacity: 0; transform: scaleX(0); pointer-events: none; }
        .show-archive #folder-pane {
            opacity: 1; transform: scaleX(1); pointer-events: auto;
        }

        .pane-header {
            background: rgba(30, 41, 59, 0.95); padding: 10px 15px;
            font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--text-light);
            border-bottom: 1px solid var(--border-subtle);
            display: flex; justify-content: space-between; align-items: center;
        }

        .sync-indicator {
            font-size: 9px; color: #38bdf8; font-weight: 500;
            display: flex; align-items: center; gap: 4px;
        }

        .view-toggle-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8; padding: 3px 8px; font-size: 9px; font-weight: 600;
            border-radius: 4px; cursor: pointer; transition: all 0.2s;
        }
        .view-toggle-btn:hover { background: #38bdf8; color: #0f172a; }

        iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* Tablet & Desktop Layout Adjustment */
        @media (min-width: 900px) {
            .viewport-grid { top: 95px; height: 82%; grid-template-columns: 1fr 1fr; gap: 20px; }
            .viewport-grid.hide-archive { grid-template-columns: 1fr 0fr; gap: 0; }
            #folder-pane { opacity: 1; transform: scaleX(1); pointer-events: auto; }
            .viewport-grid.hide-archive #folder-pane { opacity: 0; transform: scaleX(0); pointer-events: none; }
            #folder-toggle-btn { right: 30px; top: 90px; padding: 10px 16px; font-size: 11px; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header id="corporate-header">
        <div class="header-brand">
            <img src="PIN.png" id="header-logo" alt="HRMSC">
            <div class="header-text-container">
                <div id="header-title">HRMSC | OFFICIAL SHIRT ORDER FORM</div>
                <div id="header-subtitle">Human Resource Management & Course Portal</div>
            </div>
        </div>
        <div class="header-badge">Enterprise Portal v4.2</div>
    </header>

    <!-- ASSISTED TOUCH MOVABLE GCASH PAYMENT WIDGET -->
    <div id="gcash-float-banner">
        <div class="gcash-icon">G</div>
        <div>
            <div style="font-size: 9px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px;">GCASH PAYMENT (IBAA)</div>
            <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px;">0963-457-9441</div>
        </div>
        <div class="drag-handle-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <button id="folder-toggle-btn" onclick="toggleFolder()">[ ARCHIVE: SHOW ]</button>

    <div id="command-interface">
        <img src="BLEND.png" id="logo-blend-bg" alt="Background">
        
        <div class="viewport-grid" id="main-grid">
            <!-- SHIRT ORDER FORM PANE (DEFAULT FULL VIEW) -->
            <div class="pane" id="input-pane">
                <div class="pane-header">
                    <span>PORTAL: SHIRT ORDER FORM & PAYMENT UPLINK</span>
                    <span style="color: #34d399; font-size: 9px;">● SECURE</span>
                </div>
                <iframe id="order-frame" src="about:blank"></iframe>
            </div>

            <!-- ARCHIVE PANE (TOGGLEABLE) -->
            <div class="pane" id="folder-pane">
                <div class="pane-header">
                    <span>HRMSC RECORDS & MODULE ARCHIVE</span>
                    <span class="sync-indicator" id="sync-icon"><span>●</span> LIVE SYNC</span>
                    <button class="view-toggle-btn" onclick="toggleView()">TOGGLE VIEW</button>
                </div>
                <iframe id="folder-frame" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_UPLINK = "https://script.google.com/macros/s/AKfycbyGKF5w3DeyNgy7VsQra02txkyci1I1EMekXqpVRXk6MaPAvOKlww1FblCIjDrYWILiQQ/exec";
        const DRIVE_FOLDER_ID = "1E5z6QNMmJFtM2xut38Ohul3PXZzCNFZy";
        const REFRESH_RATE = 30000;
        
        let currentView = "grid"; 
        const getEmbedURL = (mode) => `https://drive.google.com/embeddedfolderview?id=${DRIVE_FOLDER_ID}#${mode}`;

        function initializeCommandCenter() {
            const orderFrame = document.getElementById('order-frame');
            orderFrame.src = GOOGLE_UPLINK;
            refreshFolder();
            setInterval(refreshFolder, REFRESH_RATE);
            initDraggableGcash();
        }

        function refreshFolder() {
            const folderFrame = document.getElementById('folder-frame');
            const syncIcon = document.getElementById('sync-icon');
            syncIcon.innerHTML = "<span>↻</span> SYNCING...";
            folderFrame.src = getEmbedURL(currentView);
            setTimeout(() => {
                syncIcon.innerHTML = "<span>●</span> LIVE SYNC";
            }, 2000);
        }

        function toggleFolder() {
            const grid = document.getElementById('main-grid');
            const btn = document.getElementById('folder-toggle-btn');
            const isDesktop = window.innerWidth >= 900;
            
            if (isDesktop) {
                grid.classList.toggle('hide-archive');
                const isHidden = grid.classList.contains('hide-archive');
                btn.innerText = isHidden ? "[ ARCHIVE: HIDDEN ]" : "[ ARCHIVE: VISIBLE ]";
            } else {
                grid.classList.toggle('show-archive');
                const isShown = grid.classList.contains('show-archive');
                btn.innerText = isShown ? "[ ARCHIVE: HIDE ]" : "[ ARCHIVE: SHOW ]";
            }
        }

        function toggleView() {
            currentView = (currentView === "grid") ? "list" : "grid";
            refreshFolder();
        }

        // Assisted Touch / Draggable Floating Widget Implementation for Touch & Mouse
        function initDraggableGcash() {
            const el = document.getElementById('gcash-float-banner');
            let isDragging = false;
            let startX, startY, initialX, initialY;

            function dragStart(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                startX = clientX;
                startY = clientY;
                
                const rect = el.getBoundingClientRect();
                initialX = rect.left;
                initialY = rect.top;
                
                // Clear out bottom/right constraints so left/top positioning works smoothly
                el.style.bottom = 'auto';
                el.style.right = 'auto';
                el.style.left = initialX + 'px';
                el.style.top = initialY + 'px';

                isDragging = true;
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                const dx = clientX - startX;
                const dy = clientY - startY;

                let newX = initialX + dx;
                let newY = initialY + dy;

                // Screen boundaries clamping
                const maxX = window.innerWidth - el.offsetWidth - 10;
                const maxY = window.innerHeight - el.offsetHeight - 10;

                newX = Math.max(10, Math.min(newX, maxX));
                newY = Math.max(70, Math.min(newY, maxY)); // Keep below header header

                el.style.left = newX + 'px';
                el.style.top = newY + 'px';
            }

            function dragEnd() {
                isDragging = false;
            }

            el.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);

            el.addEventListener('touchstart', dragStart, {passive: false});
            document.addEventListener('touchmove', drag, {passive: false});
            document.addEventListener('touchend', dragEnd);
        }

        window.onload = initializeCommandCenter;
    </script>
</body>
</html>
