<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HRMSC | Records & Order Monitoring</title>

<link rel="icon" type="image/png" href="PIN.png">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        display: flex;
        flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        flex: 0 0 auto;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: #0f172a;
        border-bottom: 1px solid rgba(255,255,255,.12);
        color: #fff;
        z-index: 10;
    }

    .title {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .status {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
        color: #86efac;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .8px;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 10px rgba(16,185,129,.7);
    }

    /* =========================
       SHEET CONTAINER
    ========================= */

    .sheet-container {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        width: 100%;
        overflow: hidden;
        background: #fff;
    }

    .sheet-container iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
    }

    /* =========================
       LOADER
    ========================= */

    .loader {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #fff;
        color: #475569;
        transition: opacity .3s ease;
    }

    .loader.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #0284c7;
        border-radius: 50%;
        animation: spin .75s linear infinite;
    }

    .loader-text {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.5px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        .header {
            height: 44px;
            padding: 0 11px;
        }

        .title {
            max-width: 72%;
            font-size: 9px;
            letter-spacing: .6px;
        }

        .status {
            font-size: 7px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
        }
    }

    @media (max-width: 380px) {

        .header {
            height: 40px;
            padding: 0 9px;
        }

        .title {
            font-size: 8px;
        }

        .status {
            font-size: 6px;
        }
    }

    /* =========================
       LANDSCAPE MOBILE
    ========================= */

    @media (max-width: 900px) and (orientation: landscape) {

        .header {
            height: 38px;
        }

        .title {
            font-size: 8px;
        }
    }
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <div class="title">
        HRMSC | RECORDS & ORDER MONITORING
    </div>

    <div class="status">
        <span class="status-dot"></span>
        VIEW ONLY
    </div>

</header>


<!-- GOOGLE SHEET ONLY -->
<main class="sheet-container">

    <div class="loader" id="sheet-loader">

        <div class="spinner"></div>

        <div class="loader-text">
            LOADING SHEET...
        </div>

    </div>

    <iframe
        id="sheet-frame"
        title="HRMSC Records and Order Monitoring"
        src="https://docs.google.com/spreadsheets/d/1Yud65cvfpplvVnVGUnFafRAyp_NOuK8RqAYWegFHj-c/edit?usp=sharing"
        loading="eager"
        allowfullscreen>
    </iframe>

</main>


<script>

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/1Yud65cvfpplvVnVGUnFafRAyp_NOuK8RqAYWegFHj-c/edit?usp=sharing";

const frame =
    document.getElementById("sheet-frame");

const loader =
    document.getElementById("sheet-loader");


frame.src = SHEET_URL;


frame.addEventListener("load", function () {

    loader.classList.add("hidden");

    setTimeout(function () {
        loader.style.display = "none";
    }, 350);

});


/*
    Fallback:
    Hide loader even if Google delays
    the iframe load event.
*/

setTimeout(function () {

    if (loader) {
        loader.classList.add("hidden");

        setTimeout(function () {
            loader.style.display = "none";
        }, 350);
    }

}, 5000);

</script>

</body>
</html>
